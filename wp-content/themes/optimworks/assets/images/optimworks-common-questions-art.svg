<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" fill="none">
<defs>
  <linearGradient id="band" x1="90" y1="420" x2="390" y2="35" gradientUnits="userSpaceOnUse">
    <stop stop-color="#ff6a0a" stop-opacity="0"/>
    <stop offset=".28" stop-color="#ff710d" stop-opacity=".92"/>
    <stop offset=".62" stop-color="#ff9a54" stop-opacity=".38"/>
    <stop offset="1" stop-color="#ffb17c" stop-opacity=".05"/>
  </linearGradient>
  <linearGradient id="bubble" x1="95" y1="100" x2="300" y2="360" gradientUnits="userSpaceOnUse">
    <stop stop-color="#fff" stop-opacity=".96"/>
    <stop offset=".62" stop-color="#fff7f3" stop-opacity=".86"/>
    <stop offset="1" stop-color="#ffd8c4" stop-opacity=".72"/>
  </linearGradient>
  <linearGradient id="orange" x1="185" y1="160" x2="280" y2="330" gradientUnits="userSpaceOnUse">
